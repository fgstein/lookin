[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lookin"
dynamic = ["version"]
description = "A visual explorer for deep-learning classification results: dataset stats, an image gallery, and cross-experiment metrics -- with an optional MLflow-backed experiment browser and an MCP endpoint for AI agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The browser interface (src/lookin/web): a FastAPI app served by
    # uvicorn. Everything it sends the browser ships in the wheel -- see the
    # offline notes in CLAUDE.md.
    "fastapi>=0.140.7",
    "uvicorn>=0.51.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "mcp>=2.3.0",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.9.0",
    "umap-learn>=0.5.6",
]

[project.scripts]
lookin = "lookin.cli:main"

[dependency-groups]
# Installed by `uv sync` (which includes dependency groups by default) and
# excluded from the wheel -- the app itself must stay dependency-light, see
# the offline notes in CLAUDE.md.
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet the per-load "[lookin] ..." prints unless a test actually fails.
addopts = "-q"

[tool.hatch.version]
path = "src/lookin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lookin"]

[tool.hatch.build.targets.sdist]
include = ["src/lookin/**/*"]
